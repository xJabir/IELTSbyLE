<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Results | IELTSbyLE</title>

<link rel="stylesheet" href="/css/main.css">

<style>

/* =========================================================
   RESULTS PAGE VARIABLES
========================================================= */

:root {
  --rs-red: #e63946;
  --rs-red-dark: #c92f3c;
  --rs-red-light: #fff1f2;

  --rs-blue: #142b5f;
  --rs-blue-dark: #0d1f46;
  --rs-blue-light: #eef3ff;

  --rs-text: #17233d;
  --rs-text-soft: #667085;

  --rs-border: #e6eaf1;
  --rs-bg: #f7f9fc;

  --rs-green: #17824b;
  --rs-green-light: #eaf8f0;

  --rs-orange: #b96a00;
  --rs-orange-light: #fff6e6;

  --rs-shadow:
    0 18px 45px rgba(20, 43, 95, 0.08);

  --rs-shadow-soft:
    0 8px 24px rgba(20, 43, 95, 0.06);
}


/* =========================================================
   GLOBAL
========================================================= */

* {
  box-sizing: border-box;
}

body {

  background:
    radial-gradient(
      circle at 10% 0%,
      rgba(230, 57, 70, 0.035),
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 5%,
      rgba(20, 43, 95, 0.045),
      transparent 28%
    ),
    var(--rs-bg);

  color: var(--rs-text);
}


/* =========================================================
   NAVIGATION
========================================================= */

.dash-nav {

  position: sticky;

  top: 0;

  z-index: 100;

  width: 100%;

  min-height: 74px;

  padding: 11px 30px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  background: rgba(255,255,255,0.92);

  border-bottom: 1px solid rgba(230,234,241,0.85);

  backdrop-filter: blur(18px);

  -webkit-backdrop-filter: blur(18px);

  box-shadow:
    0 4px 20px rgba(20,43,95,0.035);
}


.dash-nav .brand {

  display: flex;

  align-items: center;
}


.dash-nav .brand a {

  display: flex;

  align-items: center;
}


.dash-nav .brand-logo {

  width: auto;

  height: 48px;

  transition:
    transform 180ms ease;
}


.dash-nav .brand-logo:hover {

  transform: scale(1.035);
}


.dash-nav .who {

  display: flex;

  align-items: center;

  gap: 19px;

  color: var(--rs-text-soft);

  font-size: 13px;

  font-weight: 500;
}


.dash-nav .who > a:not(.button) {

  color: var(--rs-text-soft);

  text-decoration: none;

  transition:
    color 180ms ease,
    transform 180ms ease;
}


.dash-nav .who > a:not(.button):hover {

  color: var(--rs-red);

  transform: translateY(-1px);
}


#userName {

  color: var(--rs-blue);

  font-weight: 700;

  padding-left: 4px;
}


#logoutLink {

  border-radius: 8px !important;

  padding: 8px 15px !important;

  border: 1px solid var(--rs-border);

  background: #fff;

  color: var(--rs-blue) !important;

  text-decoration: none;

  transition:
    background 180ms ease,
    border-color 180ms ease,
    color 180ms ease,
    transform 180ms ease;
}


#logoutLink:hover {

  background: var(--rs-red-light);

  border-color: rgba(230,57,70,0.22);

  color: var(--rs-red) !important;

  transform: translateY(-1px);
}


/* =========================================================
   MAIN
========================================================= */

.dash-main {

  max-width: 1180px;

  margin: 0 auto;

  padding:
    46px 28px
    70px;
}


/* =========================================================
   PAGE HEADER
========================================================= */

.results-header {

  display: flex;

  align-items: flex-end;

  justify-content: space-between;

  gap: 24px;

  margin-bottom: 30px;

  animation:
    rsFadeUp 500ms ease both;
}


.results-eyebrow {

  display: inline-flex;

  align-items: center;

  gap: 8px;

  margin-bottom: 10px;

  color: var(--rs-red);

  font-size: 12px;

  font-weight: 800;

  letter-spacing: 0.13em;

  text-transform: uppercase;
}


.results-eyebrow::before {

  content: "";

  width: 26px;

  height: 2px;

  border-radius: 10px;

  background: var(--rs-red);
}


.results-header h1 {

  margin: 0;

  color: var(--rs-blue);

  font-size: clamp(30px, 4vw, 43px);

  line-height: 1.08;

  letter-spacing: -0.035em;

  font-weight: 800;
}


.results-header p {

  margin: 11px 0 0;

  max-width: 650px;

  color: var(--rs-text-soft);

  font-size: 15px;

  line-height: 1.7;
}


/* =========================================================
   PERFORMANCE CARDS
========================================================= */

.performance-grid {

  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 15px;

  margin-bottom: 31px;

  animation:
    rsFadeUp 550ms ease both;
}


.performance-card {

  position: relative;

  min-height: 120px;

  padding: 22px;

  background: rgba(255,255,255,0.94);

  border: 1px solid var(--rs-border);

  border-radius: 16px;

  box-shadow: var(--rs-shadow-soft);

  overflow: hidden;

  transition:
    transform 180ms ease,
    box-shadow 180ms ease,
    border-color 180ms ease;
}


.performance-card::after {

  content: "";

  position: absolute;

  right: -32px;

  bottom: -40px;

  width: 105px;

  height: 105px;

  border-radius: 50%;

  background: rgba(230,57,70,0.045);

  pointer-events: none;
}


.performance-card:hover {

  transform: translateY(-3px);

  border-color: rgba(20,43,95,0.13);

  box-shadow: var(--rs-shadow);
}


.performance-label {

  position: relative;

  z-index: 1;

  margin-bottom: 10px;

  color: var(--rs-text-soft);

  font-size: 11px;

  font-weight: 800;

  text-transform: uppercase;

  letter-spacing: 0.07em;
}


.performance-value {

  position: relative;

  z-index: 1;

  color: var(--rs-blue);

  font-size: 29px;

  font-weight: 800;

  line-height: 1;
}


.performance-value.band {

  color: var(--rs-red);
}


.performance-helper {

  position: relative;

  z-index: 1;

  margin-top: 8px;

  color: #8992a2;

  font-size: 11px;
}


/* =========================================================
   RESULTS SECTION
========================================================= */

.results-section {

  animation:
    rsFadeUp 650ms ease both;
}


.results-section-head {

  display: flex;

  align-items: flex-end;

  justify-content: space-between;

  gap: 20px;

  margin-bottom: 15px;
}


.results-section-head h2 {

  margin: 0;

  color: var(--rs-blue);

  font-size: 21px;

  font-weight: 800;
}


.results-section-head p {

  margin: 5px 0 0;

  color: var(--rs-text-soft);

  font-size: 13px;
}


/* =========================================================
   RESULT LIST
========================================================= */

.results-list {

  display: grid;

  gap: 14px;
}


/* =========================================================
   RESULT CARD
========================================================= */

.result-card {

  position: relative;

  display: grid;

  grid-template-columns:
    minmax(250px, 1.5fr)
    repeat(4, minmax(75px, 0.55fr))
    auto;

  align-items: center;

  gap: 16px;

  padding: 21px 22px;

  background: #fff;

  border: 1px solid var(--rs-border);

  border-radius: 15px;

  box-shadow: var(--rs-shadow-soft);

  transition:
    transform 180ms ease,
    box-shadow 180ms ease,
    border-color 180ms ease;

  animation:
    rsFadeUp 450ms ease both;
}


.result-card:hover {

  transform: translateY(-3px);

  border-color: rgba(20,43,95,0.13);

  box-shadow:
    0 15px 35px rgba(20,43,95,0.085);
}


/* =========================================================
   TEST INFORMATION
========================================================= */

.result-test {

  min-width: 0;
}


.result-test-title {

  margin-bottom: 7px;

  color: var(--rs-blue);

  font-size: 15px;

  font-weight: 800;

  line-height: 1.4;

  overflow-wrap: anywhere;
}


.result-test-date {

  color: var(--rs-text-soft);

  font-size: 11.5px;
}


.result-test-date strong {

  color: #4c5668;

  font-weight: 700;
}


/* =========================================================
   SCORE
========================================================= */

.score-block {

  text-align: center;
}


.score-label {

  margin-bottom: 6px;

  color: var(--rs-text-soft);

  font-size: 9.5px;

  font-weight: 800;

  text-transform: uppercase;

  letter-spacing: 0.07em;
}


.score-value {

  color: var(--rs-blue);

  font-size: 19px;

  font-weight: 800;

  line-height: 1;
}


.score-value.empty {

  color: #a0a7b3;

  font-weight: 600;
}


.overall-score .score-value {

  display: inline-flex;

  align-items: center;

  justify-content: center;

  min-width: 48px;

  min-height: 42px;

  padding: 7px 9px;

  border-radius: 9px;

  color: var(--rs-red);

  background: var(--rs-red-light);

  border: 1px solid #ffd8dc;

  font-size: 18px;
}


/* =========================================================
   RESULT STATUS
========================================================= */

.result-status {

  display: none;

  margin-top: 11px;

  width: fit-content;

  padding: 6px 9px;

  border-radius: 7px;

  font-size: 10px;

  font-weight: 800;
}


.result-status.graded {

  color: var(--rs-green);

  background: var(--rs-green-light);

  border: 1px solid #cfeedd;
}


.result-status.awaiting {

  color: var(--rs-orange);

  background: var(--rs-orange-light);

  border: 1px solid #f2dfb9;
}


/* =========================================================
   DETAILS BUTTON
========================================================= */

.result-details {

  display: inline-flex;

  align-items: center;

  justify-content: center;

  min-width: 86px;

  padding: 10px 14px;

  border-radius: 8px;

  color: var(--rs-blue);

  background: #fff;

  border: 1px solid var(--rs-border);

  text-decoration: none;

  font-size: 11.5px;

  font-weight: 750;

  transition:
    transform 180ms ease,
    background 180ms ease,
    color 180ms ease,
    border-color 180ms ease,
    box-shadow 180ms ease;
}


.result-details:hover {

  transform: translateY(-2px);

  color: var(--rs-red);

  background: var(--rs-red-light);

  border-color: rgba(230,57,70,0.22);

  box-shadow:
    0 7px 15px rgba(230,57,70,0.08);
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty-results {

  padding: 60px 25px;

  text-align: center;

  background: #fff;

  border: 1px dashed #d9dee8;

  border-radius: 17px;

  box-shadow: var(--rs-shadow-soft);
}


.empty-icon {

  width: 55px;

  height: 55px;

  margin: 0 auto 16px;

  display: flex;

  align-items: center;

  justify-content: center;

  border-radius: 15px;

  background: var(--rs-blue-light);

  color: var(--rs-blue);

  font-size: 22px;

  font-weight: 800;
}


.empty-results h3 {

  margin: 0 0 7px;

  color: var(--rs-blue);

  font-size: 18px;
}


.empty-results p {

  max-width: 470px;

  margin: 0 auto;

  color: var(--rs-text-soft);

  font-size: 13px;

  line-height: 1.65;
}


/* =========================================================
   ANIMATION
========================================================= */

@keyframes rsFadeUp {

  from {

    opacity: 0;

    transform:
      translateY(12px);
  }

  to {

    opacity: 1;

    transform:
      translateY(0);
  }
}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 1050px) {

  .dash-nav {

    padding-left: 22px;

    padding-right: 22px;
  }


  .dash-nav .who {

    gap: 13px;
  }


  .dash-nav .who > a:not(.button) {

    display: none;
  }


  .dash-main {

    padding-left: 22px;

    padding-right: 22px;
  }


  .performance-grid {

    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }


  .result-card {

    grid-template-columns:
      minmax(230px, 1.5fr)
      repeat(4, minmax(60px, 0.55fr))
      auto;

    gap: 10px;

    padding-left: 17px;

    padding-right: 17px;
  }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 780px) {

  .dash-nav {

    min-height: 68px;

    padding:
      9px 16px;
  }


  .dash-nav .brand-logo {

    height: 42px;
  }


  #userName {

    display: none;
  }


  #logoutLink {

    padding:
      7px 12px !important;
  }


  .dash-main {

    padding:
      34px 16px
      55px;
  }


  .results-header {

    align-items: flex-start;

    flex-direction: column;

    margin-bottom: 23px;
  }


  .results-header h1 {

    font-size: 31px;
  }


  .results-header p {

    font-size: 13.5px;
  }


  .performance-grid {

    grid-template-columns:
      repeat(2, minmax(0, 1fr));

    gap: 11px;

    margin-bottom: 27px;
  }


  .performance-card {

    min-height: 105px;

    padding: 17px;
  }


  .performance-value {

    font-size: 25px;
  }


  .performance-helper {

    font-size: 10px;
  }


  .results-section-head {

    align-items: flex-start;

    flex-direction: column;

    gap: 4px;
  }


  /*
     On mobile each result becomes a
     dedicated compact card.
  */

  .result-card {

    display: grid;

    grid-template-columns:
      1fr
      repeat(2, minmax(70px, 1fr));

    gap: 15px;

    padding: 19px;
  }


  .result-test {

    grid-column:
      1 / -1;

    padding-bottom: 4px;

    border-bottom:
      1px solid #edf0f4;
  }


  .score-block {

    text-align: left;
  }


  .score-label {

    font-size: 9px;
  }


  .score-value {

    font-size: 18px;
  }


  .overall-score {

    text-align: left;
  }


  .result-details {

    grid-column:
      1 / -1;

    width: 100%;
  }


  .result-status {

    display: inline-flex;
  }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media (max-width: 470px) {

  .performance-grid {

    grid-template-columns: 1fr;
  }


  .results-header h1 {

    font-size: 28px;
  }


  .result-card {

    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }


  .result-test {

    grid-column:
      1 / -1;
  }


  .overall-score {

    grid-column: 1;
  }


  .result-details {

    grid-column:
      1 / -1;
  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {

    animation-duration:
      0.01ms !important;

    animation-iteration-count:
      1 !important;

    transition-duration:
      0.01ms !important;

    scroll-behavior:
      auto !important;
  }

}

</style>

</head>

<body>


<!-- =======================================================
     NAVIGATION
======================================================= -->

<nav class="dash-nav">

  <div class="brand">

    <a href="/student/dashboard.html">

      <img
        src="/images/logos.png"
        alt="IELTSbyLE"
        class="brand-logo"
      >

    </a>

  </div>


  <div class="who">

    <a href="/student/dashboard.html">
      Dashboard
    </a>

    <a href="/student/resources.html">
      Resources
    </a>

    <a href="/student/mock-tests.html">
      Mock tests
    </a>

    <a href="/student/schedule.html">
      Class schedule
    </a>

    <a href="/student/speaking.html">
      Speaking test
    </a>

    <span id="userName"></span>

    <a
      href="#"
      id="logoutLink"
      class="button ghost"
    >
      Log out
    </a>

  </div>

</nav>


<!-- =======================================================
     MAIN CONTENT
======================================================= -->

<main class="dash-main">


  <!-- PAGE HEADER -->

  <section class="results-header">

    <div>

      <div class="results-eyebrow">
        Performance
      </div>

      <h1>
        My Results
      </h1>

      <p>
        Review your IELTS mock test performance,
        track your band scores, and identify areas
        where you can improve.
      </p>

    </div>

  </section>


  <!-- PERFORMANCE SUMMARY -->

  <section
    class="performance-grid"
    id="performanceGrid"
  ></section>


  <!-- RESULTS -->

  <section class="results-section">

    <div class="results-section-head">

      <div>

        <h2>
          Test history
        </h2>

        <p>
          Your submitted mock tests and band scores.
        </p>

      </div>

    </div>


    <div
      id="resultsWrap"
      class="results-list"
    ></div>

  </section>


</main>


<!-- =======================================================
     SCRIPTS
======================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/js/supabase-client.js"></script>


<script>

(async () => {

  const profile =
    await Auth.requireApprovedRole('student');

  if (!profile) return;


  document.getElementById(
    'userName'
  ).textContent =
    profile.name;


  document
    .getElementById('logoutLink')
    .addEventListener(
      'click',
      (e) => {

        e.preventDefault();

        Auth.logout();

      }
    );


  load(profile);

})();


/* =========================================================
   LOAD RESULTS
========================================================= */

async function load(profile) {

  const { data: results } =
    await supabase

      .from('submissions')

      .select(
        '*, tests(title)'
      )

      .eq(
        'student_id',
        profile.id
      )

      .neq(
        'status',
        'in_progress'
      )

      .order(
        'submitted_at',
        {
          ascending: false
        }
      );


  const wrap =
    document.getElementById(
      'resultsWrap'
    );


  if (
    !results ||
    !results.length
  ) {

    renderEmptyState();

    renderPerformance([]);

    return;
  }


  renderPerformance(results);

  renderResults(results);

}


/* =========================================================
   PERFORMANCE SUMMARY
========================================================= */

function renderPerformance(results) {

  const graded =
    results.filter(
      r =>
        r.overall_band != null
    );


  const average =
    graded.length
      ? (
          graded.reduce(
            (sum, r) =>
              sum + Number(
                r.overall_band
              ),
            0
          ) / graded.length
        ).toFixed(1)
      : '—';


  const best =
    graded.length
      ? Math.max(
          ...graded.map(
            r =>
              Number(
                r.overall_band
              )
          )
        )
      : '—';


  document.getElementById(
    'performanceGrid'
  ).innerHTML = `

    <div class="performance-card">

      <div class="performance-label">
        Tests submitted
      </div>

      <div class="performance-value">
        ${results.length}
      </div>

      <div class="performance-helper">
        Total mock tests completed
      </div>

    </div>


    <div class="performance-card">

      <div class="performance-label">
        Fully graded
      </div>

      <div class="performance-value">
        ${graded.length}
      </div>

      <div class="performance-helper">
        Results with overall bands
      </div>

    </div>


    <div class="performance-card">

      <div class="performance-label">
        Average band
      </div>

      <div class="performance-value band">
        ${average}
      </div>

      <div class="performance-helper">
        Average overall score
      </div>

    </div>


    <div class="performance-card">

      <div class="performance-label">
        Best band
      </div>

      <div class="performance-value band">
        ${best}
      </div>

      <div class="performance-helper">
        Highest overall score
      </div>

    </div>

  `;

}


/* =========================================================
   RENDER RESULT CARDS
========================================================= */

function renderResults(results) {

  const wrap =
    document.getElementById(
      'resultsWrap'
    );


  wrap.innerHTML =
    results.map(
      (r, index) => {

        const isGraded =
          r.overall_band != null;


        const statusClass =
          isGraded
            ? 'graded'
            : 'awaiting';


        const statusText =
          isGraded
            ? 'Fully graded'
            : 'Awaiting writing grade';


        return `

          <article
            class="result-card"
            style="animation-delay:${index * 45}ms"
          >


            <!-- TEST -->

            <div class="result-test">

              <div class="result-test-title">

                ${escapeHtml(
                  r.tests?.title || 'Mock test'
                )}

              </div>


              <div class="result-test-date">

                Submitted:
                <strong>
                  ${
                    formatDate(
                      r.submitted_at
                    )
                  }
                </strong>

              </div>


              <span
                class="result-status ${statusClass}"
              >
                ${statusText}
              </span>

            </div>


            <!-- LISTENING -->

            <div class="score-block">

              <div class="score-label">
                Listening
              </div>

              <div
                class="score-value
                ${r.listening_band == null ? 'empty' : ''}"
              >
                ${fmt(r.listening_band)}
              </div>

            </div>


            <!-- READING -->

            <div class="score-block">

              <div class="score-label">
                Reading
              </div>

              <div
                class="score-value
                ${r.reading_band == null ? 'empty' : ''}"
              >
                ${fmt(r.reading_band)}
              </div>

            </div>


            <!-- WRITING -->

            <div class="score-block">

              <div class="score-label">
                Writing
              </div>

              <div
                class="score-value
                ${r.writing_band == null ? 'empty' : ''}"
              >
                ${fmt(r.writing_band)}
              </div>

            </div>


            <!-- OVERALL -->

            <div class="score-block overall-score">

              <div class="score-label">
                Overall
              </div>

              <div
                class="score-value
                ${r.overall_band == null ? 'empty' : ''}"
              >
                ${fmt(r.overall_band)}
              </div>

            </div>


            <!-- DETAILS -->

            <a
              href="/student/result-detail.html?id=${r.id}"
              class="result-details"
            >
              View details
            </a>


          </article>

        `;

      }
    ).join('');

}


/* =========================================================
   EMPTY STATE
========================================================= */

function renderEmptyState() {

  const wrap =
    document.getElementById(
      'resultsWrap'
    );


  wrap.innerHTML = `

    <div class="empty-results">

      <div class="empty-icon">
        ✓
      </div>

      <h3>
        No results yet
      </h3>

      <p>
        Once you submit a mock test,
        your Listening, Reading, Writing,
        and overall band scores will appear here.
      </p>

    </div>

  `;

}


/* =========================================================
   FORMAT BAND
========================================================= */

function fmt(v) {

  return v == null
    ? '—'
    : v;

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(value) {

  if (!value) {
    return '—';
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return String(value)
      .slice(0, 10);

  }


  return date.toLocaleDateString(
    'en-GB',
    {
      day: '2-digit',
      month: 'short',
      year: 'numeric'
    }
  );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}
