<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Builder | IELTSbyLE</title>

<style>
:root {
  --v-red: #e63946;
  --v-red-dark: #c92f3d;
  --v-red-light: #fff1f2;

  --v-blue: #142b5f;
  --v-blue-dark: #0e2048;
  --v-blue-light: #eef3ff;

  --v-green: #14804a;
  --v-green-light: #ecfdf3;

  --v-amber: #b45309;
  --v-amber-light: #fffbeb;

  --v-text: #17233d;
  --v-text-soft: #667085;
  --v-muted: #98a2b3;

  --v-bg: #f6f8fc;
  --v-card: #ffffff;
  --v-border: #e7ebf2;

  --v-shadow: 0 14px 40px rgba(20, 43, 95, 0.07);
  --v-shadow-hover: 0 20px 50px rgba(20, 43, 95, 0.11);

  --v-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  background:
    radial-gradient(circle at 92% 8%, rgba(230, 57, 70, 0.045), transparent 24%),
    radial-gradient(circle at 8% 30%, rgba(20, 43, 95, 0.035), transparent 26%),
    var(--v-bg);
  color: var(--v-text);
  font-family: var(--v-sans);
}

a { color: inherit; }

/* ---------- NAV (matches the rest of the student area) ---------- */

.v-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(228,233,242,0.8);
  box-shadow: 0 4px 18px rgba(20,43,95,0.035);
}

.v-nav-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.v-brand img { height: 44px; display: block; }

.v-nav-links { display: flex; align-items: center; gap: 18px; font-size: 13px; font-weight: 600; }
.v-nav-links a { text-decoration: none; color: #526078; transition: color .2s; }
.v-nav-links a:hover { color: var(--v-red); }
.v-nav-links a.current { color: var(--v-red); }

.v-logout {
  border: 1px solid rgba(230,57,70,.2);
  background: #fff;
  color: var(--v-red);
  padding: 7px 14px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 700;
  text-decoration: none;
}
.v-logout:hover { background: var(--v-red); color: #fff; }

/* ---------- MAIN ---------- */

.v-main { max-width: 1180px; margin: 0 auto; padding: 36px 24px 80px; }

.v-header { margin-bottom: 26px; }
.v-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--v-red); margin-bottom: 8px; }
.v-header h1 { font-size: 30px; font-weight: 800; color: var(--v-blue); margin: 0 0 6px; }
.v-header p { margin: 0; color: var(--v-text-soft); font-size: 14.5px; }

/* Tabs */

.v-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  background: #fff;
  border: 1px solid var(--v-border);
  border-radius: 14px;
  padding: 6px;
  margin-bottom: 26px;
  box-shadow: var(--v-shadow);
}

.v-tab {
  border: none;
  background: transparent;
  padding: 10px 16px;
  border-radius: 9px;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--v-text-soft);
  cursor: pointer;
  transition: background .2s, color .2s;
  white-space: nowrap;
}
.v-tab:hover { background: var(--v-blue-light); color: var(--v-blue); }
.v-tab.active { background: var(--v-blue); color: #fff; }

.v-view { display: none; }
.v-view.active { display: block; animation: vfade .25s ease; }
@keyframes vfade { from { opacity:0; transform: translateY(4px);} to {opacity:1; transform:none;} }

/* Search + filters */

.v-search-wrap { margin-bottom: 18px; }

.v-search {
  width: 100%;
  padding: 14px 18px;
  border-radius: 12px;
  border: 1px solid var(--v-border);
  background: #fff;
  font-size: 15px;
  font-family: inherit;
  box-shadow: var(--v-shadow);
}
.v-search:focus { outline: none; border-color: var(--v-blue); }

.v-chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }

.v-chip {
  border: 1px solid var(--v-border);
  background: #fff;
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--v-text-soft);
  cursor: pointer;
  transition: all .15s;
}
.v-chip:hover { border-color: var(--v-blue); color: var(--v-blue); }
.v-chip.active { background: var(--v-red); border-color: var(--v-red); color: #fff; }

.v-topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 10px; margin-bottom: 22px; }

.v-topic-tile {
  border: 1px solid var(--v-border);
  background: #fff;
  border-radius: 11px;
  padding: 13px 14px;
  font-size: 13px;
  font-weight: 700;
  color: var(--v-text);
  cursor: pointer;
  text-align: left;
  transition: all .15s;
}
.v-topic-tile:hover { transform: translateY(-2px); box-shadow: var(--v-shadow); }
.v-topic-tile.active { border-color: var(--v-red); background: var(--v-red-light); color: var(--v-red-dark); }
.v-topic-tile span { display:block; font-size: 11px; font-weight: 600; color: var(--v-muted); margin-top:3px; }

.v-result-count { font-size: 12.5px; color: var(--v-muted); margin: 0 0 12px; font-weight: 600; }

/* Word cards */

.v-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px,1fr)); gap: 16px; }

.v-card {
  background: var(--v-card);
  border: 1px solid var(--v-border);
  border-radius: 15px;
  padding: 20px;
  box-shadow: var(--v-shadow);
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.v-card:hover { transform: translateY(-3px); box-shadow: var(--v-shadow-hover); }

.v-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.v-card-word { font-size: 19px; font-weight: 800; color: var(--v-blue); }
.v-card-pos { font-size: 11.5px; font-style: italic; color: var(--v-muted); margin-top: 2px; }

.v-diff {
  font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 999px; white-space: nowrap;
}
.v-diff.beginner { background: var(--v-green-light); color: var(--v-green); }
.v-diff.intermediate { background: var(--v-amber-light); color: var(--v-amber); }
.v-diff.advanced { background: var(--v-red-light); color: var(--v-red-dark); }

.v-card-meaning { font-size: 13.5px; color: var(--v-text); line-height: 1.5; }
.v-card-pron { font-size: 12px; color: var(--v-text-soft); }

.v-card-synonyms { font-size: 12px; color: var(--v-text-soft); }
.v-card-synonyms b { color: var(--v-text); }

.v-card-colloc { display: flex; flex-wrap: wrap; gap: 5px; }
.v-colloc-pill { font-size: 11px; background: var(--v-blue-light); color: var(--v-blue); padding: 3px 9px; border-radius: 999px; font-weight: 600; }

.v-card-example { font-size: 12.5px; color: var(--v-text-soft); font-style: italic; border-left: 2px solid var(--v-border); padding-left: 10px; }

.v-card-actions { display: flex; gap: 8px; margin-top: 4px; }
.v-icon-btn {
  border: 1px solid var(--v-border); background: #fff; border-radius: 8px;
  width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
  font-size: 14px; cursor: pointer; transition: all .15s; flex-shrink:0;
}
.v-icon-btn:hover { border-color: var(--v-blue); }
.v-icon-btn.on { background: var(--v-red); border-color: var(--v-red); color: #fff; }
.v-icon-btn.learned-on { background: var(--v-green); border-color: var(--v-green); color: #fff; }

.v-empty { padding: 60px 20px; text-align: center; color: var(--v-muted); font-size: 14px; }

/* Word detail modal */

.v-modal-backdrop {
  position: fixed; inset: 0; background: rgba(15,23,42,.55);
  display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 300;
}
.v-modal {
  background: #fff; border-radius: 18px; max-width: 560px; width: 100%;
  max-height: 88vh; overflow-y: auto; padding: 30px; box-shadow: var(--v-shadow-hover);
}
.v-modal-close {
  float: right; border: none; background: var(--v-blue-light); color: var(--v-blue);
  width: 32px; height: 32px; border-radius: 9px; font-size: 16px; cursor: pointer; font-weight:700;
}
.v-modal h2 { font-size: 26px; color: var(--v-blue); margin: 0 0 2px; }
.v-modal-row { margin: 16px 0; }
.v-modal-row h4 { margin: 0 0 6px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--v-muted); font-weight: 800; }
.v-modal-row p, .v-modal-row div { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--v-text); }
.v-tag-row { display:flex; flex-wrap:wrap; gap:6px; }
.v-tag { font-size: 11.5px; background: var(--v-blue-light); color: var(--v-blue); padding: 4px 10px; border-radius: 999px; font-weight: 700; }

/* Word of the Day */

.v-wotd-card {
  background: linear-gradient(135deg, var(--v-blue), var(--v-blue-dark));
  color: #fff; border-radius: 18px; padding: 32px; box-shadow: var(--v-shadow-hover);
}
.v-wotd-card .v-eyebrow { color: #ffd7da; }
.v-wotd-card h2 { font-size: 30px; margin: 0 0 4px; }
.v-wotd-card .v-card-pron { color: rgba(255,255,255,.75); }
.v-wotd-card p.meaning { font-size: 15.5px; margin: 14px 0; line-height: 1.6; }
.v-wotd-card .v-card-example { color: rgba(255,255,255,.85); border-left-color: rgba(255,255,255,.35); }
.v-wotd-topic { display:inline-block; margin-top:10px; font-size:11.5px; background: rgba(255,255,255,.15); padding: 4px 10px; border-radius:999px; }
.v-wotd-actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.v-btn {
  border: none; border-radius: 10px; padding: 11px 20px; font-size: 13.5px; font-weight: 700;
  cursor: pointer; transition: all .15s;
}
.v-btn-primary { background: #fff; color: var(--v-blue); }
.v-btn-primary:hover { transform: translateY(-1px); }
.v-btn-outline { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.4); }
.v-btn-outline:hover { background: rgba(255,255,255,.22); }
.v-btn-solid { background: var(--v-red); color: #fff; }
.v-btn-solid:hover { background: var(--v-red-dark); }
.v-btn-ghost { background: #fff; color: var(--v-blue); border: 1px solid var(--v-border); }
.v-btn-ghost:hover { background: var(--v-blue-light); }

/* Paraphrase builder */

.v-para-card {
  background: #fff; border: 1px solid var(--v-border); border-radius: 15px;
  padding: 22px; margin-bottom: 16px; box-shadow: var(--v-shadow);
}
.v-para-topic { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--v-muted); margin-bottom: 10px; }
.v-para-label { font-size: 11px; font-weight: 800; color: var(--v-muted); text-transform: uppercase; margin-bottom: 4px; }
.v-para-text { font-size: 14.5px; line-height: 1.65; margin-bottom: 14px; }
.v-swap { background: var(--v-amber-light); color: var(--v-amber); padding: 1px 5px; border-radius: 4px; font-weight: 700; }
.v-swap-arrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; background: var(--v-blue-light); color: var(--v-blue); padding: 5px 10px; border-radius: 8px; margin: 3px 6px 3px 0; font-weight: 700; }

/* Practice quiz */

.v-quiz-card {
  background: #fff; border: 1px solid var(--v-border); border-radius: 18px;
  padding: 30px; box-shadow: var(--v-shadow); max-width: 640px; margin: 0 auto;
}
.v-quiz-progress { font-size: 12px; color: var(--v-muted); font-weight: 700; margin-bottom: 10px; }
.v-quiz-type { display:inline-block; font-size: 11px; font-weight: 800; color: var(--v-red); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 10px; }
.v-quiz-prompt { font-size: 18px; font-weight: 700; color: var(--v-blue); margin-bottom: 20px; line-height: 1.5; }
.v-quiz-options { display: flex; flex-direction: column; gap: 10px; }
.v-quiz-option {
  border: 1.5px solid var(--v-border); background: #fff; border-radius: 11px;
  padding: 13px 16px; font-size: 14px; text-align: left; cursor: pointer; transition: all .15s;
}
.v-quiz-option:hover { border-color: var(--v-blue); }
.v-quiz-option.correct { border-color: var(--v-green); background: var(--v-green-light); }
.v-quiz-option.incorrect { border-color: var(--v-red); background: var(--v-red-light); }
.v-quiz-option:disabled { cursor: default; }
.v-quiz-explain { margin-top: 16px; padding: 14px 16px; border-radius: 11px; background: var(--v-blue-light); font-size: 13.5px; line-height: 1.55; color: var(--v-blue-dark); }
.v-quiz-next { margin-top: 18px; text-align: right; }

.v-quiz-summary { text-align: center; }
.v-quiz-score { font-size: 44px; font-weight: 800; color: var(--v-blue); margin: 6px 0; }
.v-revision-list { text-align: left; background: var(--v-amber-light); border-radius: 12px; padding: 16px 18px; margin: 20px 0; }
.v-revision-list h4 { margin: 0 0 8px; font-size: 12.5px; color: var(--v-amber); text-transform: uppercase; letter-spacing: .04em; }
.v-revision-list span { display:inline-block; background:#fff; border:1px solid var(--v-border); padding:4px 10px; border-radius:999px; font-size:12.5px; font-weight:700; margin: 3px 4px 0 0; }

/* My vocabulary */

.v-stat-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap: 14px; margin-bottom: 24px; }
.v-stat {
  background: #fff; border: 1px solid var(--v-border); border-radius: 13px;
  padding: 18px; text-align: center; box-shadow: var(--v-shadow);
}
.v-stat b { display:block; font-size: 26px; color: var(--v-blue); }
.v-stat span { font-size: 12px; color: var(--v-text-soft); font-weight: 600; }

.v-mv-row { display:flex; gap: 8px; margin-bottom: 16px; }

@media (max-width: 640px) {
  .v-nav-links { display: none; }
  .v-main { padding: 24px 16px 60px; }
}
</style>
</head>
<body>

<nav class="v-nav">
  <div class="v-nav-inner">
    <a href="/student/dashboard.html" class="v-brand"><img src="/images/logos.png" alt="IELTSbyLE"></a>
    <div class="v-nav-links">
      <a href="/student/dashboard.html">Dashboard</a>
      <a href="/student/resources.html" class="current">Resources</a>
      <a href="/student/mock-tests.html">Mock tests</a>
      <a href="/student/results.html">My results</a>
      <span id="userName" style="font-weight:700;color:var(--v-blue);font-size:13px;"></span>
      <a href="#" id="logoutLink" class="v-logout">Log out</a>
    </div>
  </div>
</nav>

<main class="v-main">

  <div class="v-header">
    <div class="v-eyebrow">IELTS Essentials</div>
    <h1>Vocabulary Builder</h1>
    <p>Build your IELTS vocabulary one word at a time.</p>
  </div>

  <div class="v-tabs" id="tabs">
    <button class="v-tab active" data-view="browse">Browse</button>
    <button class="v-tab" data-view="wotd">Word of the Day</button>
    <button class="v-tab" data-view="paraphrase">Paraphrase Builder</button>
    <button class="v-tab" data-view="practice">Practice Mode</button>
    <button class="v-tab" data-view="myvocab">My Vocabulary</button>
  </div>

  <!-- BROWSE -->
  <section class="v-view active" id="view-browse">

    <div class="v-search-wrap">
      <input type="text" class="v-search" id="searchInput" placeholder="Search a word, topic, or skill...">
    </div>

    <div class="v-chip-row" id="skillChips"></div>
    <div class="v-topic-grid" id="topicGrid"></div>

    <div class="v-chip-row" id="extraChips"></div>

    <p class="v-result-count" id="resultCount"></p>
    <div class="v-grid" id="wordGrid"></div>

  </section>

  <!-- WORD OF THE DAY -->
  <section class="v-view" id="view-wotd"></section>

  <!-- PARAPHRASE BUILDER -->
  <section class="v-view" id="view-paraphrase">
    <p style="color:var(--v-text-soft);font-size:13.5px;margin-bottom:18px;">
      See how IELTS expresses the same idea with different vocabulary — especially useful for Reading, Listening, and Writing.
    </p>
    <div id="paraphraseList"></div>
  </section>

  <!-- PRACTICE MODE -->
  <section class="v-view" id="view-practice">
    <div id="practiceArea"></div>
  </section>

  <!-- MY VOCABULARY -->
  <section class="v-view" id="view-myvocab">
    <div class="v-stat-grid" id="mvStats"></div>
    <div class="v-mv-row">
      <button class="v-chip active" data-mvfilter="all">All</button>
      <button class="v-chip" data-mvfilter="saved">Saved</button>
      <button class="v-chip" data-mvfilter="learned">Learned</button>
      <button class="v-chip" data-mvfilter="review">To review</button>
    </div>
    <div class="v-grid" id="myVocabGrid"></div>
  </section>

</main>

<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/vocab-data.js"></script>
<script>

/* =========================================
   STATE
========================================= */

let profile = null;
let progress = new Map();      // word slug -> 'saved' | 'learned'
let activeView = 'browse';
let activeSkill = 'all';
let activeTopic = null;
let activeExtra = null;        // 'task1' | 'task2' | null
let searchQuery = '';
let mvFilter = 'all';

let quizState = null;

const TOPICS = [
  'Education','Environment','Technology','Health','Work & Employment','Society',
  'Crime','Travel & Tourism','Media','Science','Culture','Food','Government',
  'Globalisation','Family & Relationships'
];

function slugOf(word) { return word.toLowerCase().replace(/[^a-z0-9]+/g, '-'); }

/* =========================================
   INIT
========================================= */

(async () => {

  profile = await Auth.requireApprovedRole('student');
  if (!profile) return;

  document.getElementById('userName').textContent = profile.name || 'Student';
  document.getElementById('logoutLink').addEventListener('click', (e) => { e.preventDefault(); Auth.logout(); });

  await loadProgress();

  renderSkillChips();
  renderTopicGrid();
  renderExtraChips();
  renderWordGrid();
  renderWordOfTheDay();
  renderParaphraseList();
  renderMyVocab();

  wireTabs();
  wireSearch();

})();

async function loadProgress() {

  try {
    const { data, error } = await supabase
      .from('vocab_progress')
      .select('word_slug, status')
      .eq('student_id', profile.id);

    if (error) { console.error(error); return; }

    progress = new Map((data || []).map(r => [r.word_slug, r.status]));

  } catch (e) {
    console.error(e);
  }

}

async function setProgress(word, status) {

  const slug = slugOf(word);

  if (status === null) {
    progress.delete(slug);
    await supabase.from('vocab_progress').delete().eq('student_id', profile.id).eq('word_slug', slug);
  } else {
    progress.set(slug, status);
    await supabase.from('vocab_progress').upsert({ student_id: profile.id, word_slug: slug, status, updated_at: new Date().toISOString() });
  }

  renderWordGrid();
  renderMyVocab();
  refreshOpenModalButtons();

}

/* =========================================
   TABS
========================================= */

function wireTabs() {

  document.querySelectorAll('.v-tab').forEach(tab => {

    tab.addEventListener('click', () => {

      document.querySelectorAll('.v-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');

      document.querySelectorAll('.v-view').forEach(v => v.classList.remove('active'));

      activeView = tab.dataset.view;
      document.getElementById(`view-${activeView}`).classList.add('active');

      if (activeView === 'practice' && !quizState) startQuiz();

    });

  });

}

/* =========================================
   BROWSE: search + filters
========================================= */

function wireSearch() {
  const input = document.getElementById('searchInput');
  input.addEventListener('input', () => { searchQuery = input.value.trim().toLowerCase(); renderWordGrid(); });
}

function renderSkillChips() {

  const skills = [
    { id: 'all', label: 'All' },
    { id: 'listening', label: 'Listening' },
    { id: 'reading', label: 'Reading' },
    { id: 'writing', label: 'Writing' },
    { id: 'speaking', label: 'Speaking' }
  ];

  const el = document.getElementById('skillChips');
  el.innerHTML = skills.map(s => `<button class="v-chip ${s.id === activeSkill ? 'active' : ''}" data-skill="${s.id}">${s.label}</button>`).join('');

  el.querySelectorAll('[data-skill]').forEach(btn => btn.addEventListener('click', () => {
    activeSkill = btn.dataset.skill;
    activeExtra = null;
    el.querySelectorAll('.v-chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    renderExtraChips();
    renderWordGrid();
  }));

}

function renderExtraChips() {

  const el = document.getElementById('extraChips');

  if (activeSkill !== 'writing') { el.innerHTML = ''; return; }

  const opts = [
    { id: 'task1', label: 'Task 1 — Graphs & Trends' },
    { id: 'task2', label: 'Task 2 — Essays & Opinions' }
  ];

  el.innerHTML = opts.map(o => `<button class="v-chip ${o.id === activeExtra ? 'active' : ''}" data-extra="${o.id}">${o.label}</button>`).join('');

  el.querySelectorAll('[data-extra]').forEach(btn => btn.addEventListener('click', () => {
    activeExtra = activeExtra === btn.dataset.extra ? null : btn.dataset.extra;
    el.querySelectorAll('.v-chip').forEach(c => c.classList.remove('active'));
    if (activeExtra) btn.classList.add('active');
    renderWordGrid();
  }));

}

function renderTopicGrid() {

  const el = document.getElementById('topicGrid');

  el.innerHTML = TOPICS.map(t => {
    const count = VOCAB_DATA.filter(w => w.topic === t).length;
    return `<button class="v-topic-tile ${t === activeTopic ? 'active' : ''}" data-topic="${t}">${t}<span>${count} words</span></button>`;
  }).join('');

  el.querySelectorAll('[data-topic]').forEach(btn => btn.addEventListener('click', () => {
    activeTopic = activeTopic === btn.dataset.topic ? null : btn.dataset.topic;
    el.querySelectorAll('.v-topic-tile').forEach(c => c.classList.remove('active'));
    if (activeTopic) btn.classList.add('active');
    renderWordGrid();
  }));

}

function filteredWords() {

  return VOCAB_DATA.filter(w => {

    if (activeSkill !== 'all' && !w.skills.includes(activeSkill)) return false;
    if (activeExtra && w.taskTag !== activeExtra) return false;
    if (activeTopic && w.topic !== activeTopic) return false;

    if (searchQuery) {
      const hay = `${w.word} ${w.topic} ${w.skills.join(' ')} ${w.meaning}`.toLowerCase();
      if (!hay.includes(searchQuery)) return false;
    }

    return true;

  });

}

function renderWordGrid() {

  const words = filteredWords();
  document.getElementById('resultCount').textContent = `${words.length} word${words.length === 1 ? '' : 's'} found`;

  const grid = document.getElementById('wordGrid');

  if (!words.length) {
    grid.innerHTML = `<div class="v-empty" style="grid-column:1/-1;">No words match your filters yet. Try a different search or topic.</div>`;
    return;
  }

  grid.innerHTML = words.map(w => wordCardHtml(w)).join('');
  wireWordCards(grid);

}

function wordCardHtml(w) {

  const slug = slugOf(w.word);
  const status = progress.get(slug);

  return `
    <article class="v-card" data-word="${slug}">
      <div class="v-card-top">
        <div>
          <div class="v-card-word">${w.word}</div>
          <div class="v-card-pos">${w.pos}</div>
        </div>
        <span class="v-diff ${w.difficulty}">${w.difficulty}</span>
      </div>
      <div class="v-card-pron">🔊 <span data-speak="${w.word}" style="cursor:pointer;text-decoration:underline;">${w.pronunciation}</span></div>
      <div class="v-card-meaning">${w.meaning}</div>
      <div class="v-card-synonyms"><b>Synonyms:</b> ${w.synonyms.join(', ')}</div>
      <div class="v-card-colloc">${w.collocations.map(c => `<span class="v-colloc-pill">${c}</span>`).join('')}</div>
      <div class="v-card-example">"${w.example}"</div>
      <div class="v-card-actions">
        <button class="v-icon-btn ${status === 'saved' ? 'on' : ''}" data-save="${w.word}" title="Save word">⭐</button>
        <button class="v-icon-btn ${status === 'learned' ? 'learned-on' : ''}" data-learn="${w.word}" title="Mark as learned">✓</button>
      </div>
    </article>
  `;

}

function wireWordCards(root) {

  root.querySelectorAll('[data-speak]').forEach(el => el.addEventListener('click', (e) => { e.stopPropagation(); speak(el.dataset.speak); }));

  root.querySelectorAll('[data-save]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation();
    const cur = progress.get(slugOf(el.dataset.save));
    setProgress(el.dataset.save, cur === 'saved' ? null : 'saved');
  }));

  root.querySelectorAll('[data-learn]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation();
    const cur = progress.get(slugOf(el.dataset.learn));
    setProgress(el.dataset.learn, cur === 'learned' ? null : 'learned');
  }));

  root.querySelectorAll('.v-card').forEach(card => card.addEventListener('click', () => openWordModal(card.dataset.word)));

}

function speak(word) {
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-GB';
  u.rate = 0.9;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

      <p class="meaning">${w.meaning}</p>
      <div class="v-card-example">"${w.example}"</div>
      <span class="v-wotd-topic">${w.topic}</span>
      <div style="margin-top:14px;font-size:13px;"><b>Collocations:</b> ${w.collocations.join(', ')}</div>
      <div class="v-wotd-actions">

        <button class="v-btn v-btn-outline" id="wotdSaveBtn">${status === 'saved' ? 'Saved ✓' : 'Add to My Vocabulary'}</button>

/* =========================================
   PARAPHRASE BUILDER
========================================= */

function highlightSwaps(text, swaps, side) {
  let out = text;
  swaps.forEach(pair => {
    const term = side === 'from' ? pair[0] : pair[1];
    const re = new RegExp(`\\b${term}\\b`, 'i');
    out = out.replace(re, m => `<span class="v-swap">${m}</span>`);
  });
  return out;
}

function renderParaphraseList() {

  const el = document.getElementById('paraphraseList');

  el.innerHTML = PARAPHRASE_DATA.map(p => `
    <div class="v-para-card">
      <div class="v-para-topic">${p.topic}</div>
      <div class="v-para-label">Original</div>
      <div class="v-para-text">${highlightSwaps(p.original, p.swaps, 'from')}</div>
      <div class="v-para-label">Possible paraphrase</div>
      <div class="v-para-text">${highlightSwaps(p.paraphrase, p.swaps, 'to')}</div>
      <div>${p.swaps.map(s => `<span class="v-swap-arrow">${s[0]} → ${s[1]}</span>`).join('')}</div>
    </div>
  `).join('');

}

/* =========================================
   PRACTICE MODE
========================================= */

const QUESTION_TYPES = ['meaning','synonym','fillblank','match','sentence','collocation','paraphrase'];

function pickRandom(arr, n, excludeIdx) {
  const pool = arr.map((v,i) => i).filter(i => i !== excludeIdx);
  const chosen = [];
  while (chosen.length < n && pool.length) {
    const i = Math.floor(Math.random() * pool.length);
    chosen.push(pool.splice(i,1)[0]);
  }
  return chosen.map(i => arr[i]);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildQuestion(type, pool) {

  if (type === 'paraphrase') {

    const idx = Math.floor(Math.random() * PARAPHRASE_DATA.length);
    const correct = PARAPHRASE_DATA[idx];
    const distractors = pickRandom(PARAPHRASE_DATA, 3, idx);
    const options = shuffle([{ text: correct.paraphrase, correct: true }, ...distractors.map(d => ({ text: d.paraphrase, correct: false }))]);

    return {
      type: 'Identify the correct paraphrase',
      prompt: `Which sentence best paraphrases: "${correct.original}"`,
      options,
      explanation: `The key swaps are: ${correct.swaps.map(s => `${s[0]} → ${s[1]}`).join(', ')}.`,
      revisionTag: correct.topic
    };

  }

  const idx = Math.floor(Math.random() * pool.length);
  const w = pool[idx];
  const distractorWords = pickRandom(VOCAB_DATA, 3, VOCAB_DATA.indexOf(w));

  if (type === 'meaning') {
    const options = shuffle([{ text: w.meaning, correct: true }, ...distractorWords.map(d => ({ text: d.meaning, correct: false }))]);
    return { type: 'Choose the correct meaning', prompt: `What does "${w.word}" mean?`, options, explanation: `"${w.word}" means: ${w.meaning}`, revisionTag: w.word };
  }

  if (type === 'synonym') {
    const options = shuffle([{ text: w.synonyms[0], correct: true }, ...distractorWords.map(d => ({ text: d.synonyms[0], correct: false }))]);
    return { type: 'Choose the correct synonym', prompt: `Which word is closest in meaning to "${w.word}"?`, options, explanation: `"${w.synonyms[0]}" is a close synonym of "${w.word}".`, revisionTag: w.word };
  }

  if (type === 'fillblank') {
    const blanked = w.example.replace(new RegExp(w.word, 'i'), '_____');
    const options = shuffle([{ text: w.word, correct: true }, ...distractorWords.map(d => ({ text: d.word, correct: false }))]);
    return { type: 'Fill in the blank', prompt: blanked, options, explanation: `The full sentence is: "${w.example}"`, revisionTag: w.word };
  }

  if (type === 'match') {
    const options = shuffle([{ text: w.word, correct: true }, ...distractorWords.map(d => ({ text: d.word, correct: false }))]);
    return { type: 'Match the word with its meaning', prompt: `Which word matches this meaning: "${w.meaning}"`, options, explanation: `"${w.word}" means: ${w.meaning}`, revisionTag: w.word };
  }

  if (type === 'sentence') {
    const template = `The report highlighted a _____ related to ${w.topic.toLowerCase()}.`;
    const options = shuffle([{ text: w.collocations[0], correct: true }, ...distractorWords.map(d => ({ text: d.collocations[0], correct: false }))]);
    return { type: 'Complete the sentence', prompt: template, options, explanation: `"${w.collocations[0]}" fits naturally here — it's a common collocation with "${w.word}".`, revisionTag: w.word };
  }

  if (type === 'collocation') {
    const wrongColloc = distractorWords.map(d => d.collocations[0]);
    const options = shuffle([{ text: w.collocations[0], correct: true }, ...wrongColloc.map(c => ({ text: c, correct: false }))]);
    return { type: 'Choose the correct collocation', prompt: `Which collocation goes with "${w.word}"?`, options, explanation: `"${w.collocations.join('", "')}" are natural collocations with "${w.word}".`, revisionTag: w.word };
  }

}

function startQuiz() {

  const pool = filteredWords().length >= 6 ? filteredWords() : VOCAB_DATA;
  const total = 8;
  const questions = [];

  for (let i = 0; i < total; i++) {
    const type = QUESTION_TYPES[i % QUESTION_TYPES.length];
    questions.push(buildQuestion(type, pool));
  }

  quizState = { questions, index: 0, score: 0, revision: [], answered: false };
  renderQuiz();

}

function renderQuiz() {

  const area = document.getElementById('practiceArea');

  if (quizState.index >= quizState.questions.length) {
    renderQuizSummary();
    return;
  }

  const q = quizState.questions[quizState.index];

  area.innerHTML = `
    <div class="v-quiz-card">
      <div class="v-quiz-progress">Question ${quizState.index + 1} of ${quizState.questions.length} &middot; Score: ${quizState.score}</div>
      <span class="v-quiz-type">${q.type}</span>
      <div class="v-quiz-prompt">${q.prompt}</div>
      <div class="v-quiz-options" id="quizOptions">
        ${q.options.map((o, i) => `<button class="v-quiz-option" data-i="${i}">${o.text}</button>`).join('')}
      </div>
      <div id="quizFeedback"></div>
    </div>
  `;

  document.querySelectorAll('#quizOptions .v-quiz-option').forEach(btn => {
    btn.addEventListener('click', () => answerQuiz(Number(btn.dataset.i)));
  });

}

function answerQuiz(i) {

  if (quizState.answered) return;
  quizState.answered = true;

  const q = quizState.questions[quizState.index];
  const chosen = q.options[i];

  document.querySelectorAll('#quizOptions .v-quiz-option').forEach((btn, idx) => {
    btn.disabled = true;
    if (q.options[idx].correct) btn.classList.add('correct');
    else if (idx === i) btn.classList.add('incorrect');
  });

  if (chosen.correct) {
    quizState.score++;
  } else if (q.revisionTag) {
    quizState.revision.push(q.revisionTag);
  }

  document.getElementById('quizFeedback').innerHTML = `
    <div class="v-quiz-explain">${chosen.correct ? '✅ Correct! ' : '❌ Not quite. '}${q.explanation}</div>
    <div class="v-quiz-next"><button class="v-btn v-btn-solid" id="nextQBtn">${quizState.index + 1 >= quizState.questions.length ? 'See results' : 'Next question'}</button></div>
  `;

  document.getElementById('nextQBtn').addEventListener('click', () => {
    quizState.index++;
    quizState.answered = false;
    renderQuiz();
  });

}

function renderQuizSummary() {

  const area = document.getElementById('practiceArea');
  const total = quizState.questions.length;
  const revisionUnique = [...new Set(quizState.revision)];

  area.innerHTML = `
    <div class="v-quiz-card v-quiz-summary">
      <div class="v-eyebrow" style="color:var(--v-red);">Practice complete</div>
      <div class="v-quiz-score">${quizState.score}/${total}</div>
      <p style="color:var(--v-text-soft);">${quizState.score === total ? 'Perfect score — excellent work!' : 'Review the words below and try again to improve.'}</p>
      ${revisionUnique.length ? `
        <div class="v-revision-list">
          <h4>Words that need revision</h4>
          <div>${revisionUnique.map(w => `<span>${w}</span>`).join('')}</div>
        </div>
      ` : ''}
      <div class="v-wotd-actions" style="justify-content:center;">
        <button class="v-btn v-btn-solid" id="retryQuizBtn">Try again</button>
        <button class="v-btn v-btn-ghost" id="backBrowseBtn">Back to browse</button>
      </div>
    </div>
  `;

  document.getElementById('retryQuizBtn').addEventListener('click', startQuiz);
  document.getElementById('backBrowseBtn').addEventListener('click', () => {
    document.querySelector('.v-tab[data-view="browse"]').click();
  });

}

/* =========================================
   MY VOCABULARY
========================================= */

function renderMyVocab() {

  const saved = [...progress.entries()].filter(([,s]) => s === 'saved').map(([slug]) => slug);
  const learned = [...progress.entries()].filter(([,s]) => s === 'learned').map(([slug]) => slug);
  const total = progress.size;

  document.getElementById('mvStats').innerHTML = `
    <div class="v-stat"><b>${total}</b><span>Total saved words</span></div>
    <div class="v-stat"><b>${learned.length}</b><span>Learned words</span></div>
    <div class="v-stat"><b>${saved.length}</b><span>Words to review</span></div>
    <div class="v-stat"><b>${Math.min(total,5)}</b><span>Recently added</span></div>
  `;

  const grid = document.getElementById('myVocabGrid');
  const words = VOCAB_DATA.filter(w => progress.has(slugOf(w.word)));

  let shown = words;
  if (mvFilter === 'saved') shown = words.filter(w => progress.get(slugOf(w.word)) === 'saved');
  if (mvFilter === 'learned') shown = words.filter(w => progress.get(slugOf(w.word)) === 'learned');
  if (mvFilter === 'review') shown = words.filter(w => progress.get(slugOf(w.word)) === 'saved');

  if (!shown.length) {
    grid.innerHTML = `<div class="v-empty" style="grid-column:1/-1;">No words here yet — save or learn words from Browse to build your list.</div>`;
  } else {
    grid.innerHTML = shown.map(w => wordCardHtml(w)).join('');
    wireWordCards(grid);
  }

  document.querySelectorAll('[data-mvfilter]').forEach(btn => {
    btn.onclick = () => {
      mvFilter = btn.dataset.mvfilter;
      document.querySelectorAll('[data-mvfilter]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMyVocab();
    };
  });

}
