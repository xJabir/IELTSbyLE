<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login — London Educators</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <a href="/index.html" style="font-size:13px;color:var(--ink-soft);">← London Educators</a>
    <h1 style="margin-top:14px;">Student login</h1>
    <p class="sub">Sign in to see your mock tests and band scores.</p>
    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <div class="form-error" id="formError"></div>
      <div class="submit-row"><button type="submit" class="button primary block" id="submitBtn">Log in</button></div>
    </form>
    <p class="form-note">New here? <a href="/signup.html" style="text-decoration:underline;">Create a student account</a></p>
    <p class="form-note">Teacher? <a href="/teacher-login.html" style="text-decoration:underline;">Log in here</a></p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('formError');
  const btn = document.getElementById('submitBtn');
  errorBox.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Logging in…';

  const { data, error } = await supabase.auth.signInWithPassword({
    email: document.getElementById('email').value,
    password: document.getElementById('password').value
  });

  if (error) {
    errorBox.textContent = error.message;
    errorBox.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Log in';
    return;
  }

  const { data: profile } = await supabase.from('profiles').select('role').eq('id', data.user.id).single();
  if (!profile || profile.role !== 'student') {
    await supabase.auth.signOut();
    errorBox.textContent = 'This account is registered as a teacher — use the teacher login page.';
    errorBox.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Log in';
    return;
  }

  window.location.href = '/student/dashboard.html';
});
</script>
</body>
</html>
