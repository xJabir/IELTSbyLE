<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submissions — IELTSbyLE</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>

<nav class="dash-nav">
  <div class="brand"><a href="/teacher/dashboard.html"><img src="/images/logo.png" alt="IELTSbyLE" class="brand-logo"></a></div>
  <div class="who">
    <span id="userName"></span>
    <a href="/teacher/dashboard.html">← All tests</a>
    <a href="#" id="logoutLink" class="button ghost" style="padding:7px 14px;">Log out</a>
  </div>
</nav>

<main class="dash-main">
  <div class="dash-head"><h1 id="pageTitle">Submissions</h1></div>
  <div id="subList"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script>
const testId = new URLSearchParams(location.search).get('testId');

(async () => {
  const profile = await Auth.requireRole('teacher');
  if (!profile) return;
  document.getElementById('userName').textContent = profile.name;
  document.getElementById('logoutLink').addEventListener('click', (e) => { e.preventDefault(); Auth.logout(); });
  load();
})();

async function load() {
  const { data: test } = await supabase.from('tests').select('title').eq('id', testId).single();
  if (test) document.getElementById('pageTitle').textContent = `Submissions — ${test.title}`;

  const { data: submissions, error } = await supabase
    .from('submissions')
    .select('*, profiles(name, email)')
    .eq('test_id', testId)
    .neq('status', 'in_progress')
    .order('submitted_at', { ascending: false });

  const el = document.getElementById('subList');
  if (error) { el.innerHTML = `<div class="empty-state"><h3>Couldn't load submissions</h3><p>${escapeHtml(error.message)}</p></div>`; return; }
  if (!submissions || !submissions.length) {
    el.innerHTML = `<div class="empty-state"><h3>No submissions yet</h3><p>They'll appear here once a student finishes this mock test.</p></div>`;
    return;
  }

  el.innerHTML = `
    <table class="band-table">
      <thead><tr>
        <th>Student</th><th>Submitted</th><th>Listening</th><th>Reading</th><th>Writing</th><th>Overall</th><th></th>
      </tr></thead>
      <tbody>
        ${submissions.map(s => `
          <tr>
            <td>${escapeHtml(s.profiles.name)}<br><span style="font-size:12px;color:var(--ink-soft);">${escapeHtml(s.profiles.email)}</span></td>
            <td>${s.submitted_at ? s.submitted_at.slice(0, 16).replace('T', ' ') : '—'}</td>
            <td class="band">${fmt(s.listening_band)}</td>
            <td class="band">${fmt(s.reading_band)}</td>
            <td class="band">${fmt(s.writing_band)}</td>
            <td class="band">${fmt(s.overall_band)}</td>
            <td>
              ${s.status === 'graded' ? '<span class="badge done">Graded</span>' : '<span class="badge pending">Needs grade</span>'}
              <a href="/teacher/grade.html?subId=${s.id}" class="small-btn" style="margin-left:8px;">Open</a>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function fmt(v) { return v == null ? '—' : v; }
</script>
</body>
</html>
