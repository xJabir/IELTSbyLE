<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Build Mock Test | IELTSbyLE</title>

<link rel="stylesheet" href="/css/main.css">

<style>

/* =========================================================
   IELTSbyLE TEST BUILDER
   ========================================================= */

:root {

  --builder-red: #e63946;
  --builder-red-dark: #cf3040;
  --builder-red-light: #fff1f2;

  --builder-blue: #142b5f;
  --builder-blue-dark: #0e2048;
  --builder-blue-light: #eef3ff;

  --builder-text: #17233d;
  --builder-text-soft: #667085;

  --builder-border: #e7ebf2;

  --builder-bg: #f7f9fc;

}


/* =========================================================
   PAGE
   ========================================================= */

body {

  margin: 0;

  background:
    radial-gradient(
      circle at 8% 0%,
      rgba(230,57,70,0.04),
      transparent 28%
    ),
    radial-gradient(
      circle at 95% 5%,
      rgba(20,43,95,0.045),
      transparent 30%
    ),
    var(--builder-bg);

  color: var(--builder-text);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

}


/* =========================================================
   NAVBAR
   ========================================================= */

.dash-nav {

  position: sticky;

  top: 0;

  z-index: 100;

  width: 100%;

  min-height: 74px;

  box-sizing: border-box;

  padding: 10px 32px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  background:
    rgba(255,255,255,0.93);

  backdrop-filter: blur(18px);

  -webkit-backdrop-filter: blur(18px);

  border-bottom:
    1px solid rgba(228,233,242,0.8);

  box-shadow:
    0 4px 18px rgba(20,43,95,0.035);

}


.brand {

  display: flex;

  align-items: center;

  flex-shrink: 0;

}


.brand a {

  display: flex;

  align-items: center;

}


.brand-logo {

  height: 48px;

  width: auto;

  display: block;

  transition:
    transform .25s ease;

}


.brand-logo:hover {

  transform: scale(1.035);

}


/* =========================================================
   NAV LINKS
   ========================================================= */

.who {

  display: flex;

  align-items: center;

  gap: 20px;

  font-size: 13px;

  font-weight: 600;

}


.who a:not(.builder-logout):not(.back-tests) {

  color: #526078;

  text-decoration: none;

  transition:
    color .2s ease,
    transform .2s ease;

}


.who a:not(.builder-logout):not(.back-tests):hover {

  color: var(--builder-red);

  transform: translateY(-1px);

}


#userName {

  color:
    var(--builder-blue);

  font-size:
    13px;

  font-weight:
    700;

}


/* =========================================================
   ALL TESTS LINK
   ========================================================= */

.back-tests {

  display: inline-flex;

  align-items: center;

  gap: 5px;

  color:
    var(--builder-blue) !important;

  text-decoration: none;

  font-weight:
    700;

  transition:
    color .2s ease,
    transform .2s ease;

}


.back-tests:hover {

  color:
    var(--builder-red) !important;

  transform:
    translateX(-2px);

}


/* =========================================================
   LOGOUT
   ========================================================= */

.builder-logout {

  display: inline-flex;

  align-items: center;

  justify-content: center;

  min-height: 36px;

  padding:
    0 15px;

  border-radius: 8px;

  border:
    1px solid rgba(230,57,70,0.2);

  background:
    #fff;

  color:
    var(--builder-red) !important;

  text-decoration: none;

  transition:
    background .2s ease,
    color .2s ease,
    transform .2s ease,
    box-shadow .2s ease;

}


.builder-logout:hover {

  background:
    var(--builder-red);

  color:
    #fff !important;

  transform:
    translateY(-1px);

  box-shadow:
    0 7px 18px rgba(230,57,70,0.18);

}


/* =========================================================
   MAIN
   ========================================================= */

.dash-main {

  width:
    min(
      1180px,
      calc(100% - 48px)
    );

  margin:
    0 auto;

  padding:
    45px 0 70px;

}


/* =========================================================
   TEST HEADER
   ========================================================= */

.builder-header {

  position:
    relative;

  overflow:
    hidden;

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    25px;

  padding:
    30px 34px;

  margin-bottom:
    22px;

  border-radius:
    20px;

  background:
    linear-gradient(
      135deg,
      var(--builder-blue),
      #1b3978 65%,
      #21458c
    );

  box-shadow:
    0 18px 42px rgba(20,43,95,0.15);

}


.builder-header::before {

  content: "";

  position: absolute;

  width:
    230px;

  height:
    230px;

  right:
    -80px;

  top:
    -125px;

  border-radius:
    50%;

  background:
    rgba(255,255,255,0.065);

}


.builder-header::after {

  content: "";

  position: absolute;

  width:
    155px;

  height:
    155px;

  right:
    150px;

  bottom:
    -115px;

  border-radius:
    50%;

  background:
    rgba(230,57,70,0.18);

}


.builder-heading {

  position:
    relative;

  z-index:
    2;

  min-width:
    0;

}


.builder-eyebrow {

  color:
    rgba(255,255,255,0.66);

  font-size:
    10px;

  font-weight:
    800;

  letter-spacing:
    1.5px;

  text-transform:
    uppercase;

  margin-bottom:
    8px;

}


#testTitleHeading {

  margin:
    0;

  color:
    #fff;

  font-size:
    clamp(24px, 3.5vw, 34px);

  line-height:
    1.2;

  letter-spacing:
    -.8px;

  font-weight:
    750;

  overflow:
    hidden;

  text-overflow:
    ellipsis;

}


.builder-header-actions {

  position:
    relative;

  z-index:
    3;

  display:
    flex;

  align-items:
    center;

  gap:
    9px;

}


/* =========================================================
   PUBLISH BADGE
   ========================================================= */

#publishBadge {

  display:
    inline-flex;

  align-items:
    center;

}


/* Allow JS inserted badges to look consistent */

#publishBadge .badge {

  display:
    inline-flex;

  align-items:
    center;

  min-height:
    31px;

  padding:
    0 11px;

  border-radius:
    7px;

  font-size:
    10px;

  font-weight:
    750;

}


/* =========================================================
   PUBLISH BUTTON
   ========================================================= */

#publishBtn {

  position:
    relative;

  display:
    inline-flex;

  align-items:
    center;

  justify-content:
    center;

  min-height:
    42px;

  padding:
    0 17px;

  border-radius:
    8px;

  border:
    1px solid rgba(255,255,255,0.18);

  background:
    var(--builder-red);

  color:
    #fff;

  font-family:
    inherit;

  font-size:
    12px;

  font-weight:
    750;

  cursor:
    pointer;

  transition:
    background .2s ease,
    transform .2s ease,
    box-shadow .2s ease;

}


#publishBtn:hover {

  background:
    var(--builder-red-dark);

  transform:
    translateY(-2px);

  box-shadow:
    0 9px 22px rgba(0,0,0,0.18);

}


/* =========================================================
   TABS
   ========================================================= */

.tabs {

  display:
    flex;

  align-items:
    center;

  gap:
    5px;

  width:
    fit-content;

  max-width:
    100%;

  padding:
    5px;

  margin-bottom:
    20px;

  background:
    #edf1f7;

  border-radius:
    10px;

  overflow-x:
    auto;

}


.tabs button {

  border:
    0;

  background:
    transparent;

  color:
    #687386;

  padding:
    10px 18px;

  border-radius:
    7px;

  font-family:
    inherit;

  font-size:
    12px;

  font-weight:
    700;

  white-space:
    nowrap;

  cursor:
    pointer;

  transition:
    background .2s ease,
    color .2s ease,
    box-shadow .2s ease;

}


.tabs button:hover {

  color:
    var(--builder-blue);

}


.tabs button.active {

  background:
    #fff;

  color:
    var(--builder-blue);

  box-shadow:
    0 3px 10px rgba(20,43,95,0.08);

}


/* =========================================================
   TAB CONTENT
   ========================================================= */

.tab-content {

  animation:
    tabFade .25s ease both;

}


@keyframes tabFade {

  from {

    opacity:
      0;

    transform:
      translateY(5px);

  }

  to {

    opacity:
      1;

    transform:
      translateY(0);

  }

}


/*
   Existing JavaScript may generate cards,
   forms, fields and lists using the classes
   from main.css. These refinements make those
   components fit the new visual language.
*/


/* =========================================================
   COMMON CARDS
   ========================================================= */

.tab-content > div {

  border-radius:
    14px;

}


/* =========================================================
   FORM FIELDS
   ========================================================= */

.tab-content input,
.tab-content textarea,
.tab-content select {

  border-color:
    #dfe4ec;

  border-radius:
    8px;

  transition:
    border-color .18s ease,
    box-shadow .18s ease;

}


.tab-content input:focus,
.tab-content textarea:focus,
.tab-content select:focus {

  outline:
    none;

  border-color:
    var(--builder-blue);

  box-shadow:
    0 0 0 3px
    rgba(20,43,95,0.08);

}


/* =========================================================
   COMMON BUTTONS
   ========================================================= */

.tab-content button {

  border-radius:
    8px;

}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 1050px) {

  .dash-nav {

    padding:
      10px 22px;

  }

  .who {

    gap:
      13px;

  }

  .who a {

    font-size:
      12px;

  }

}


@media (max-width: 850px) {

  .who a:not(.builder-logout):not(.back-tests) {

    display:
      none;

  }

}


@media (max-width: 700px) {

  .dash-nav {

    min-height:
      66px;

    padding:
      9px 16px;

  }

  .brand-logo {

    height:
      42px;

  }

  #userName {

    display:
      none;

  }

  .dash-main {

    width:
      calc(100% - 28px);

    padding:
      28px 0 50px;

  }

  .builder-header {

    flex-direction:
      column;

    align-items:
      flex-start;

    padding:
      27px 23px;

    border-radius:
      16px;

  }

  #testTitleHeading {

    font-size:
      27px;

  }

  .builder-header-actions {

    width:
      100%;

    justify-content:
      flex-start;

  }

  #publishBtn {

    min-width:
      100px;

  }

  .tabs {

    width:
      100%;

    box-sizing:
      border-box;

  }

  .tabs button {

    flex:
      1;

    padding:
      10px 12px;

  }

}


@media (max-width: 500px) {

  .builder-header-actions {

    flex-wrap:
      wrap;

  }

  .tabs {

    gap:
      3px;

  }

  .tabs button {

    font-size:
      11px;

    padding:
      9px 10px;

  }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {

    animation-duration:
      .01ms !important;

    animation-iteration-count:
      1 !important;

    transition-duration:
      .01ms !important;

  }

}

</style>
</head>

<body>


<!-- =======================================================
     NAVIGATION
     ======================================================= -->

<nav class="dash-nav">

  <div class="brand">

    <a href="/teacher/dashboard.html">

      <img
        src="/images/logos.png"
        alt="IELTSbyLE"
        class="brand-logo"
      >

    </a>

  </div>


  <div class="who">

    <span id="userName"></span>

    <a href="/teacher/lecture-schedule.html">
      Lecture Schedule
    </a>

    <a href="/teacher/resources.html">
      Resources
    </a>

    <a href="/teacher/approvals.html">
      Student Approvals
    </a>

    <a
      href="/teacher/dashboard.html"
      class="back-tests"
    >
      ← All Tests
    </a>

    <a
      href="#"
      id="logoutLink"
      class="builder-logout"
    >
      Log out
    </a>

  </div>

</nav>


<!-- =======================================================
     MAIN
     ======================================================= -->

<main class="dash-main">


  <!-- TEST HEADER -->

  <section class="builder-header">

    <div class="builder-heading">

      <div class="builder-eyebrow">
        Mock Test Builder
      </div>

      <h1 id="testTitleHeading">
        Loading…
      </h1>

    </div>


    <div class="builder-header-actions">

      <span id="publishBadge"></span>

      <button
        id="publishBtn"
        type="button"
      >
        Publish
      </button>

    </div>

  </section>


  <!-- TEST BUILDER TABS -->

  <div class="tabs">

    <button
      class="active"
      data-tab="details"
    >
      Details
    </button>

    <button
      data-tab="reading"
    >
      Reading
    </button>

    <button
      data-tab="listening"
    >
      Listening
    </button>

    <button
      data-tab="writing"
    >
      Writing
    </button>

  </div>


  <!-- DETAILS -->

  <div
    id="tab-details"
    class="tab-content"
  ></div>


  <!-- READING -->

  <div
    id="tab-reading"
    class="tab-content"
    style="display:none;"
  ></div>


  <!-- LISTENING -->

  <div
    id="tab-listening"
    class="tab-content"
    style="display:none;"
  ></div>


  <!-- WRITING -->

  <div
    id="tab-writing"
    class="tab-content"
    style="display:none;"
  ></div>


</main>


<!-- =======================================================
     SCRIPTS
     ======================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/js/supabase-client.js"></script>

<script src="/js/teacher-create-test.js"></script>


</body>
</html>
