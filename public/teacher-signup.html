<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Teacher Account — London Educators</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <a href="/index.html" style="font-size:13px;color:var(--ink-soft);"></a>
    <h1 style="margin-top:14px;">Create your teacher account</h1>
    <p class="sub">Build mock tests, publish them to your students, and grade writing submissions.</p>
    <form id="signupForm">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" required autocomplete="name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-error" id="formError"></div>
      <div class="submit-row"><button type="submit" class="button primary block" id="submitBtn">Create account</button></div>
    </form>
    <p class="form-note">Already have an account? <a href="/teacher-login.html" style="text-decoration:underline;">Log in</a></p>
    <p class="form-note">Student, not teacher? <a href="/signup.html" style="text-decoration:underline;">Create a student account</a></p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('formError');
  const btn = document.getElementById('submitBtn');
  errorBox.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Creating account…';

  const { data, error } = await supabase.auth.signUp({
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
    options: { data: { name: document.getElementById('name').value, role: 'teacher' } }
  });

  if (error) {
    errorBox.textContent = error.message;
    errorBox.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Create account';
    return;
  }

  if (!data.session) {
    errorBox.style.display = 'block';
    errorBox.style.background = '#E4EFE7';
    errorBox.style.borderColor = 'var(--good)';
    errorBox.style.color = 'var(--good)';
    errorBox.textContent = 'Account created — check your email to confirm it, then log in.';
    btn.textContent = 'Check your email';
    return;
  }

  window.location.href = '/teacher/dashboard.html';
});
</script>
</body>
</html>
